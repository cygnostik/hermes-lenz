name: lenz
version: "1.1.2"
manifest_version: 2
api_version: 1
requires_hermes: ">=0.23.2"
license: MIT
description: "Preview a fact check, screen claims or review a draft with Lenz. Track the shared balance and reserve at most 500 credits per profile per Lenz month."
author: "cygnostik"
requires_env:
  - name: LENZ_API_KEY
    secret: true
    description: Your own Lenz key for this Hermes profile
    url: https://lenz.io/api-credentials
provides_tools:
  - lenz_policy
  - lenz_extract
  - lenz_assess
  - lenz_verify
  - lenz_review
  - lenz_status
  - lenz_usage
config_schema:
  api_key:
    type: secret
    env: LENZ_API_KEY
    label: Lenz API key
    description: Create a key at lenz.io/api-credentials. A local preview needs no key.
  mode:
    type: str
    default: normal
    label: Check depth and draft limits
    choices: [light, moderate, normal, heavy, critical-only]
    description: "Maximum per draft: light 2 (quick only), moderate 10, normal 32, heavy 74, critical-only 13. All share the same monthly budget."
